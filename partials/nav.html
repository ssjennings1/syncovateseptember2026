<!-- ============================================================
     SYNCOVATE — NAV (dark, current homepage design)
     Paste as ONE custom-code element at the top of the page.
     Self-contained: fonts + CSS + markup + mobile toggle.

     Per-page setup: move aria-current="page" to whichever link
     matches the page this is pasted on (it's set to "Home" below).
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sy-gold:      #BF8756;
  --sy-gold-deep: #9E6D41;
  --sy-charcoal:  #252830;
  --sy-cream:     #FAF8F5;
  --sy-dim:       #C9C5BC;
  --sy-rule-dark: rgba(201,197,188,0.18);
  --sy-serif:     'Cormorant Garamond', Georgia, serif;
  --sy-sans:      'DM Sans', system-ui, -apple-system, sans-serif;
}
.sy-nav *{margin:0;padding:0;box-sizing:border-box;text-align:left}
.sy-nav{font-family:var(--sy-sans);text-align:left}
.sy-nav .wrap{margin-left:auto!important;margin-right:auto!important}
.sy-nav a{color:inherit;text-decoration:none}
.sy-nav a:focus-visible,.sy-nav button:focus-visible{outline:2px solid var(--sy-gold);outline-offset:3px}
.sy-nav-bar{
  position:sticky;position:-webkit-sticky;top:0;z-index:60;
  background:rgba(37,40,48,0.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--sy-rule-dark);
}
.sy-nav .wrap{max-width:1120px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.sy-nav .brand{font-family:var(--sy-serif);font-weight:600;font-size:21px;letter-spacing:0.09em;text-transform:uppercase;color:var(--sy-cream)}
.sy-nav .nav-links{display:flex;align-items:center;gap:30px;list-style:none}
.sy-nav .nav-links a{
  font-size:13.5px;font-weight:500;letter-spacing:0.03em;text-transform:uppercase;
  color:var(--sy-dim);padding:6px 0;border-bottom:1px solid transparent;
  transition:border-color .18s,color .18s;
}
.sy-nav .nav-links a:hover,.sy-nav .nav-links a[aria-current]{color:var(--sy-cream);border-bottom-color:var(--sy-gold)}
.sy-nav .nav-cta{display:flex;align-items:center;gap:14px}
.sy-nav .btn-gold{
  display:inline-flex!important;align-items:center!important;justify-content:center!important;
  font-family:var(--sy-sans)!important;font-weight:500!important;font-size:13px!important;letter-spacing:0.02em!important;line-height:1!important;
  padding:12px 20px!important;border-radius:2px!important;white-space:nowrap!important;
  background:var(--sy-gold)!important;color:#fff!important;border:1px solid var(--sy-gold)!important;
  text-decoration:none!important;
  transition:background .18s ease,border-color .18s ease,transform .12s ease;
}
.sy-nav .btn-gold:active{transform:translateY(1px)}
.sy-nav .btn-gold:hover{background:var(--sy-gold-deep)!important;border-color:var(--sy-gold-deep)!important;color:#fff!important}
.sy-nav .nav-toggle{
  display:none;background:none;border:1px solid var(--sy-rule-dark);
  width:42px;height:42px;border-radius:2px;cursor:pointer;
  align-items:center;justify-content:center;flex-direction:column;gap:5px;
}
.sy-nav .nav-toggle span{display:block;width:18px;height:1.5px;background:var(--sy-cream)}
@media (max-width:840px){
  .sy-nav .nav-links{display:none}
  .sy-nav .nav-toggle{display:flex}
  .sy-nav-bar.open .nav-links{
    display:flex;flex-direction:column;align-items:flex-start;gap:0;
    position:absolute;left:0;right:0;top:76px;
    background:var(--sy-charcoal);border-bottom:1px solid var(--sy-rule-dark);
    padding:10px 32px 18px;
  }
  .sy-nav-bar.open .nav-links a{display:block;padding:14px 0;font-size:15px;width:100%;border-bottom:1px solid var(--sy-rule-dark)}
}
@media (max-width:520px){.sy-nav .wrap{padding:0 22px}.sy-nav-bar.open .nav-links{padding:10px 22px 18px}}
/* GHL engine CSS hardcodes 10px side padding on every .c-row at <=767px (not editable in the visual editor). Override it here since this stylesheet loads after GHL's base CSS and wins the tie-break. */
@media (max-width:767px){.c-row{padding-left:0!important;padding-right:0!important}}
</style>
<div class="sy-nav">
<header class="sy-nav-bar" id="syNav">
  <div class="wrap">
    <a class="brand" href="https://syncovatellc.com/">Syncovate</a>
    <ul class="nav-links" id="syNavLinks">
      <li><a href="https://syncovatellc.com/" aria-current="page">Home</a></li>
      <li><a href="https://syncovatellc.com/how-i-work">How I Work</a></li>
      <li><a href="https://syncovatellc.com/speaking">Speaking</a></li>
      <li><a href="https://syncovatellc.com/prism-blog">Field Notes</a></li>
      <li><a href="https://syncovatellc.com/meet-dr-j">Meet Dr. J</a></li>
    </ul>
    <div class="nav-cta">
      <a class="btn-gold" href="https://link.syncovatellc.com/widget/booking/29K6RwPvCIc2xOxgUVKo" style="display:inline-flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;letter-spacing:0.02em;line-height:1;padding:12px 20px;border-radius:2px;white-space:nowrap;background:#BF8756;color:#fff;border:1px solid #BF8756;text-decoration:none;">Let's Talk</a>
      <button class="nav-toggle" id="syNavToggle" aria-label="Open menu" aria-expanded="false" aria-controls="syNavLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
</div>
<script>
(function(){
  var nav=document.getElementById('syNav'),t=document.getElementById('syNavToggle');
  if(!nav||!t)return;
  t.addEventListener('click',function(){
    var open=nav.classList.toggle('open');
    t.setAttribute('aria-expanded',open?'true':'false');
    t.setAttribute('aria-label',open?'Close menu':'Open menu');
  });
})();
</script>
